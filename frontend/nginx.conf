server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite general de subida. El backend aplica los máximos reales
    # (25 MB por adjunto, 50 MB por ZIP); acá se deja margen para no
    # cortar antes con un 413.
    client_max_body_size 60M;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Adjuntos (comprobantes, entregas): el backend permite hasta 25 MB.
        client_max_body_size 26M;
    }

    # Subida de ZIP (50MB): límite mayor que el resto de /api/
    location = /api/admin/deployed-cards/upload {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60M;
    }

    # Re-subida de ZIP a una tarjeta existente (50MB): mismo límite amplio.
    # Sin esto caía en /api/ (10M) y el navegador recibía 413.
    location ~ ^/api/admin/deployed-cards/[0-9]+/redeploy$ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60M;
    }

    # Tarjetas estáticas desplegadas vía ZIP: solo cuando hay slug
    # (/tarjetas-digitales/cliente123). Sin slug va al SPA (catálogo).
    location ~ ^/tarjetas-digitales/.+ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
